# CRT filtering proxy — allowlist-only outbound access.
# Blocked requests appear as TCP_DENIED in the access log.
#
# Inspect:
#   docker compose exec proxy cat /var/log/squid/access.log
#   docker compose exec proxy cat /var/log/squid/access.log | grep DENIED

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
http_access allow allowed_domains
http_access deny all

http_port 3128
access_log daemon:/var/log/squid/access.log
cache_dir ufs /var/spool/squid 10 16 256
cache deny all
visible_hostname crt-proxy
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
